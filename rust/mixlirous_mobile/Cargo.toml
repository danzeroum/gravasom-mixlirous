[package]
name = "mixlirous_mobile"
version = "0.1.0"
edition = "2021"
description = "Ponte UniFFI do motor Mixlirous para o app Gravasom Mixlirous (Android)"
license = "MIT OR Apache-2.0"

[lib]
name = "mixlirous_mobile"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
# Motor da Mixlirous (subtree). A rede do audio_agent fica DESLIGADA no celular
# (default-features = false → feature "network" off, sem reqwest): o provedor
# LLM é local, implementado em Kotlin e entra por callback UniFFI.
audio_core = { path = "../../third_party/mixlirous/crates/audio_core" }
audio_agent = { path = "../../third_party/mixlirous/crates/audio_agent", default-features = false }

uniffi = { version = "0.32", features = ["cli"] }
ndarray = "0.17.2"
serde_json = "1"
futures = "0.3"
async-trait = "0.1"
thiserror = "1.0"
# Runtime async do kernel ReAct (worker threads para spawn_blocking das
# chamadas à SLM local em Kotlin).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
